<!doctype html>
<html><head><meta charset="utf-8"><title>Bir müşteri soru sordu</title></head>
<body style="margin:0;padding:0;background:#f4f5f7;">
<table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;padding:24px 0;">
  <tr><td align="center">
    <table width="600" cellpadding="0" cellspacing="0" style="background:#ffffff;border:1px solid #e6e8eb;font-family:Arial,Helvetica,sans-serif;color:#2b2f33;">
      <tr>
        <td style="padding:22px 28px 0;">
          <img src="{shop_logo}" alt="{shop_name}" style="max-height:48px;border:0;">
        </td>
      </tr>
      <tr>
        <td style="padding:18px 28px 28px;font-size:14px;line-height:1.6;">
          <h1 style="margin:0 0 14px;font-size:18px;">Bir müşteri soru sordu</h1>
          <p style="margin:0 0 6px;"><strong>{asked_by}</strong>, <strong>{product}</strong> hakkında sordu:</p>
          <blockquote style="margin:12px 0;padding:12px 16px;background:#f7f8f9;border-left:3px solid #2ecc71;">{question}</blockquote>
          <p style="margin:18px 0 0;">Soru moderasyon kuyruğunda bekliyor. Siz cevabı yazmadan hiçbir şey yayınlanmaz.</p>
          <p style="margin:16px 0 0;"><a href="{answer_url}" style="background:#2ecc71;color:#ffffff;padding:10px 18px;text-decoration:none;display:inline-block;">Cevapla</a></p>
          <p style="margin:24px 0 0;color:#8a949c;font-size:12px;">Ürün SSS ve Müşteri Soruları modülü tarafından gönderildi.</p>
        </td>
      </tr>
    </table>
  </td></tr>
</table>
</body></html>
